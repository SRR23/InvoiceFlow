# Run unit/API tests on every PR and push.
# With Render Auto-Deploy = "After CI Checks Pass", a green run on main
# allows Render to deploy. Tests use a temporary Postgres service — not Neon.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoiceflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d invoiceflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ci-secret-not-for-production
      DATABASE_URL: ""
      DB_NAME: invoiceflow
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      # Avoid accidental Redis dependency during tests (conftest also forces locmem cache)
      REDIS_URL: redis://127.0.0.1:6379/1
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/development.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Run tests
        run: pytest
