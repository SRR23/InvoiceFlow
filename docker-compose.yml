# Full local stack: web + Celery worker + Celery beat + Postgres + Redis.
#
# Usage:
#   cp .env.docker.example .env.docker   # first time
#   docker compose --env-file .env.docker up --build
#
# App API: http://localhost:8000
# Swagger: http://localhost:8000/api/docs/
# Host ports: Postgres 5433, Redis 6380 (container-internal stay 5432/6379)
#
# Important: Compose Postgres is used (DB_HOST=db). Neon DATABASE_URL is cleared
# so the containers do not accidentally talk to your cloud DB.

name: invoiceflow

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-invoiceflow}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Host 5433 avoids clashing with a local Postgres on 5432
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - invoiceflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-invoiceflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Force Compose networking / local DB (overrides Neon URL from .env)
      DATABASE_URL: ""
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-invoiceflow}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RUN_MIGRATIONS: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,web
    ports:
      - "${WEB_HOST_PORT:-8000}:8000"
    volumes:
      # Live code reload for local development
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Dev server (use gunicorn CMD from Dockerfile for a prod-like local run)
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: ""
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-invoiceflow}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]

  beat:
    build: .
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: ""
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-invoiceflow}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]

volumes:
  invoiceflow_pgdata:
